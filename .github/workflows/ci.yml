name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  database:
    name: Integration, e2e, build
    needs: checks
    runs-on: ubuntu-latest
    # Uses a dedicated Neon branch for CI (see README). Skipped until the secrets exist.
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      HAS_DATABASE: ${{ secrets.DATABASE_URI != '' }}
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Skip when the CI database is not configured
        if: env.HAS_DATABASE != 'true'
        run: echo "::notice::Add DATABASE_URI and PAYLOAD_SECRET secrets to run integration, e2e and build."
      - uses: actions/checkout@v4
        if: env.HAS_DATABASE == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_DATABASE == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: env.HAS_DATABASE == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.HAS_DATABASE == 'true'
      - run: pnpm test:int
        if: env.HAS_DATABASE == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: env.HAS_DATABASE == 'true'
      - run: pnpm test:e2e
        if: env.HAS_DATABASE == 'true'
      - uses: actions/upload-artifact@v4
        if: env.HAS_DATABASE == 'true' && failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - run: pnpm build
        if: env.HAS_DATABASE == 'true'
